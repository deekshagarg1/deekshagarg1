<svg width="700" height="45" viewBox="0 0 700 45" xmlns="http://www.w3.org/2000/svg">
  <style>
    .line1 { animation: show1 9s infinite; opacity: 0; }
    .line2 { animation: show2 9s infinite; opacity: 0; }
    .line3 { animation: show3 9s infinite; opacity: 0; }
