    @keyframes show2 { 0%, 33% { opacity: 0; } 34%, 63% { opacity: 1; } 66%, 100% { opacity: 0; } }
    @keyframes show3 { 0%, 66% { opacity: 0; } 67%, 97% { opacity: 1; } 100% { opacity: 0; } }
  </style>
  <text x="350" y="30" font-family="Consolas, monospace" font-size="22" font-weight="bold" fill="#4F75FF" text-anchor="middle" class="line1">🚀 Building Full-Stack Web Applications</text>
  <text x="350" y="30" font-family="Consolas, monospace" font-size="22" font-weight="bold" fill="#4F75FF" text-anchor="middle" class="line2">💻 Crafting Interactive UI/UX with React</text>
  <text x="350" y="30" font-family="Consolas, monospace" font-size="22" font-weight="bold" fill="#4F75FF" text-anchor="middle" class="line3">⚡ Engineering Scalable REST APIs &amp; Databases</text>
</svg>